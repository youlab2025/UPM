[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upm-inference"
version = "0.1.0"
description = "UPM perturbation response inference"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1", "numpy>=1.24,<2", "scipy>=1.10", "anndata>=0.9",
    "safetensors>=0.4", "huggingface-hub>=0.23,<2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
upm-infer = "upm.cli:main"
upm-export = "upm.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
